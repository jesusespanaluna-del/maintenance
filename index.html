<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sika Maintenance App</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function calcTiempo(t1, t2) {
            if (!t1 || !t2) return "-";
            const [h1, m1] = t1.split(":").map(Number);
            const [h2, m2] = t2.split(":").map(Number);
            let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (diff < 0) diff += 1440;
            const h = Math.floor(diff / 60);
            const m = diff % 60;
            return h > 0 ? `${h}h ${m}m` : `${m}m`;
        }

        function App() {
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem("sika_data");
                return saved ? JSON.parse(saved) : [];
            });
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState({
                equipo: "", novedad: "", reporte: "", inicio: "", fin: "", status: "Pendiente"
            });

            useEffect(() => {
                localStorage.setItem("sika_data", JSON.stringify(records));
            }, [records]);

            const guardar = () => {
                if(!form.equipo || !form.novedad) return alert("Llena Equipo y Novedad");
                setRecords([...records, { ...form, id: Date.now() }]);
                setShowForm(false);
                setForm({ equipo: "", novedad: "", reporte: "", inicio: "", fin: "", status: "Pendiente" });
            };

            return (
                <div className="p-4 max-w-4xl mx-auto font-sans">
                    <div className="bg-red-600 text-white p-6 rounded-t-xl shadow-lg">
                        <h1 className="text-2xl font-black italic">SIKA MAINTENANCE</h1>
                        <p className="text-xs font-bold opacity-80 uppercase">Registro de Correctivos</p>
                    </div>

                    <div className="bg-white p-4 shadow flex justify-between rounded-b-xl mb-6">
                        <button onClick={() => setShowForm(true)} className="bg-red-600 text-white px-6 py-2 rounded font-bold hover:bg-red-700">
                            + NUEVO REGISTRO
                        </button>
                        <div className="text-right">
                            <p className="text-[10px] text-gray-400 font-bold">TOTAL HOY</p>
                            <p className="text-xl font-black text-slate-700">{records.length}</p>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-xl overflow-hidden border border-gray-200">
                        <table className="w-full text-sm">
                            <thead className="bg-slate-800 text-white text-[10px] uppercase">
                                <tr>
                                    <th className="p-4 text-left">Equipo / Falla</th>
                                    <th className="p-4 text-center">Reporte</th>
                                    <th className="p-4 text-center">Inicio</th>
                                    <th className="p-4 text-center">Fin</th>
                                    <th className="p-4 bg-orange-600 text-center">Espera</th>
                                    <th className="p-4 bg-blue-600 text-center">Reparación</th>
                                </tr>
                            </thead>
                            <tbody>
                                {records.map(r => (
                                    <tr key={r.id} className="border-b hover:bg-gray-50">
                                        <td className="p-4">
                                            <div className="font-bold uppercase">{r.equipo}</div>
                                            <div className="text-xs text-gray-500">{r.novedad}</div>
                                        </td>
                                        <td className="p-4 text-center font-mono">{r.reporte || "--:--"}</td>
                                        <td className="p-4 text-center font-mono">{r.inicio || "--:--"}</td>
                                        <td className="p-4 text-center font-mono">{r.fin || "--:--"}</td>
                                        <td className="p-4 text-center font-bold text-orange-600 bg-orange-50">{calcTiempo(r.reporte, r.inicio)}</td>
                                        <td className="p-4 text-center font-bold text-blue-700 bg-blue-50">{calcTiempo(r.inicio, r.fin)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {showForm && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-lg w-full max-w-md overflow-hidden">
                                <div className="bg-slate-800 p-4 text-white font-bold flex justify-between uppercase text-xs tracking-widest">
                                    <span>Registrar Novedad</span>
                                    <button onClick={() => setShowForm(false)}>✕</button>
                                </div>
                                <div className="p-6 space-y-4">
                                    <input placeholder="EQUIPO" className="w-full border-2 p-3 rounded uppercase font-bold text-sm" 
                                        onChange={e => setForm({...form, equipo: e.target.value})} />
                                    <textarea placeholder="NOVEDAD / FALLA" className="w-full border-2 p-3 rounded text-sm" 
                                        onChange={e => setForm({...form, novedad: e.target.value})} />
                                    <div className="grid grid-cols-3 gap-2">
                                        <div><p className="text-[9px] font-bold text-gray-400">REPORTE</p>
                                        <input type="time" className="w-full border p-1" onChange={e => setForm({...form, reporte: e.target.value})} /></div>
                                        <div><p className="text-[9px] font-bold text-gray-400">INICIO</p>
                                        <input type="time" className="w-full border p-1" onChange={e => setForm({...form, inicio: e.target.value})} /></div>
                                        <div><p className="text-[9px] font-bold text-gray-400">FIN</p>
                                        <input type="time" className="w-full border p-1" onChange={e => setForm({...form, fin: e.target.value})} /></div>
                                    </div>
                                    <button onClick={guardar} className="w-full bg-red-600 text-white py-4 rounded font-black uppercase">GUARDAR</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
