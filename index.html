<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sika Maintenance - Registro Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f3f4f6]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STATUS_COLORS = {
            "Pendiente": "bg-yellow-100 text-yellow-800",
            "En Proceso": "bg-blue-100 text-blue-800",
            "Resuelto": "bg-green-100 text-green-800",
        };

        function diffMinutes(t1, t2) {
            if (!t1 || !t2) return null;
            const [h1, m1] = t1.split(":").map(Number);
            const [h2, m2] = t2.split(":").map(Number);
            let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (diff < 0) diff += 1440;
            const h = Math.floor(diff / 60);
            const m = total = diff % 60;
            const res = h > 0 ? `${h}h ${m}m` : `${m}m`;
            return res;
        }

        function App() {
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem("sika_final_v3");
                return saved ? JSON.parse(saved) : [];
            });
            const [showForm, setShowForm] = useState(false);
            const [editId, setEditId] = useState(null);
            
            // Filtros
            const [filterTerm, setFilterTerm] = useState("");
            const [filterDate, setFilterDate] = useState("");
            const [filterStatus, setFilterStatus] = useState("");

            const [form, setForm] = useState({
                equipo: "", novedad: "", inicio: "", fin: "", 
                status: "Pendiente", fecha: new Date().toISOString().split('T')[0]
            });

            useEffect(() => {
                localStorage.setItem("sika_final_v3", JSON.stringify(records));
            }, [records]);

            const filteredRecords = useMemo(() => {
                return records.filter(r => {
                    const matchTerm = r.equipo.toLowerCase().includes(filterTerm.toLowerCase());
                    const matchDate = filterDate ? r.fecha === filterDate : true;
                    const matchStatus = filterStatus ? r.status === filterStatus : true;
                    return matchTerm && matchDate && matchStatus;
                });
            }, [records, filterTerm, filterDate, filterStatus]);

            const guardar = () => {
                if(!form.equipo || !form.novedad) return alert("Equipo y Novedad son obligatorios");
                if (editId) {
                    setRecords(records.map(r => r.id === editId ? form : r));
                } else {
                    setRecords([{ ...form, id: Date.now() }, ...records]);
                }
                cerrarForm();
            };

            const cerrarForm = () => {
                setShowForm(false);
                setEditId(null);
                setForm({ equipo: "", novedad: "", inicio: "", fin: "", status: "Pendiente", fecha: new Date().toISOString().split('T')[0] });
            };

            const exportarExcel = () => {
                const header = "Fecha,Equipo,Novedad,Status,Inicio,Fin,Duracion\n";
                const csv = filteredRecords.map(r => `${r.fecha},"${r.equipo}","${r.novedad}",${r.status},${r.inicio},${r.fin},${diffMinutes(r.inicio, r.fin)}`).join("\n");
                const blob = new Blob(["\uFEFF" + header + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Reporte_Sika.csv`;
                link.click();
            };

            return (
                <div className="min-h-screen p-4 max-w-6xl mx-auto">
                    {/* Header Azul como en la imagen */}
                    <div className="bg-blue-700 text-white rounded-xl p-6 mb-6 flex justify-between items-center shadow-lg border-b-4 border-blue-800">
                        <div>
                            <h1 className="text-2xl font-bold italic tracking-tight">🛠️ Correctivos del Día</h1>
                            <p className="text-blue-100 text-sm">Registro histórico de incidencias</p>
                        </div>
                        <div className="bg-blue-900/50 px-4 py-2 rounded-lg text-sm font-bold border border-blue-400">
                            {records.length} registros
                        </div>
                    </div>

                    {/* Filtros */}
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input type="date" className="bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm" 
                            value={filterDate} onChange={e => setFilterDate(e.target.value)} />
                        <input className="bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm" 
                            placeholder="🔍 Buscar Equipo..." value={filterTerm} onChange={e => setFilterTerm(e.target.value)} />
                        <select className="bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm"
                            value={filterStatus} onChange={e => setFilterStatus(e.target.value)}>
                            <option value="">Todos los status</option>
                            <option>Pendiente</option>
                            <option>En Proceso</option>
                            <option>Resuelto</option>
                        </select>
                    </div>

                    {/* Botones */}
                    <div className="flex gap-3 mb-6">
                        <button onClick={() => setShowForm(true)} className="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-bold shadow hover:bg-blue-700 transition">+ Nuevo Correctivo</button>
                        <button onClick={exportarExcel} className="bg-green-600 text-white px-6 py-2.5 rounded-lg font-bold shadow hover:bg-green-700">⬇ Exportar CSV</button>
                        <button onClick={() => {setFilterTerm(""); setFilterDate(""); setFilterStatus("");}} className="bg-gray-200 text-gray-600 px-6 py-2.5 rounded-lg font-bold hover:bg-gray-300">✕ Limpiar filtros</button>
                    </div>

                    {/* Tabla */}
                    <div className="bg-white rounded-xl shadow-xl overflow-hidden border border-slate-200 mb-8">
                        <table className="w-full text-left border-collapse text-sm">
                            <thead className="bg-blue-700 text-white font-bold uppercase text-[10px]">
                                <tr>
                                    <th className="px-6 py-4">Fecha / Equipo</th>
                                    <th className="px-6 py-4">Novedad</th>
                                    <th className="px-6 py-4 text-center">Status</th>
                                    <th className="px-6 py-4 text-center">T. Inicio</th>
                                    <th className="px-6 py-4 text-center">T. Fin</th>
                                    <th className="px-6 py-4 text-center">Duración</th>
                                    <th className="px-6 py-4 text-right">Acciones</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {filteredRecords.map(r => (
                                    <tr key={r.id} className="hover:bg-blue-50/30 transition">
                                        <td className="px-6 py-4">
                                            <div className="text-[10px] font-bold text-blue-600">{r.fecha}</div>
                                            <div className="font-bold text-slate-800 uppercase">{r.equipo}</div>
                                        </td>
                                        <td className="px-6 py-4 text-slate-600">{r.novedad}</td>
                                        <td className="px-6 py-4 text-center">
                                            <span className={`px-2 py-1 rounded-full text-[10px] font-black uppercase ${STATUS_COLORS[r.status]}`}>{r.status}</span>
                                        </td>
                                        <td className="px-6 py-4 text-center font-mono">{r.inicio || "--:--"}</td>
                                        <td className="px-6 py-4 text-center font-mono">{r.fin || "--:--"}</td>
                                        <td className="px-6 py-4 text-center font-bold text-blue-700">{diffMinutes(r.inicio, r.fin)}</td>
                                        <td className="px-6 py-4 text-right">
                                            <button onClick={() => {setForm(r); setEditId(r.id); setShowForm(true);}} className="text-blue-600 p-2">✏️</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* Resumen Final de la Imagen */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-yellow-50 border-2 border-yellow-200 p-6 rounded-2xl text-center shadow-sm">
                            <div className="text-3xl font-black text-yellow-700">{records.filter(r => r.status === "Pendiente").length}</div>
                            <div className="text-[10px] font-bold text-yellow-600 uppercase tracking-widest">Pendiente</div>
                        </div>
                        <div className="bg-blue-50 border-2 border-blue-200 p-6 rounded-2xl text-center shadow-sm">
                            <div className="text-3xl font-black text-blue-700">{records.filter(r => r.status === "En Proceso").length}</div>
                            <div className="text-[10px] font-bold text-blue-600 uppercase tracking-widest">En Proceso</div>
                        </div>
                        <div className="bg-green-50 border-2 border-green-200 p-6 rounded-2xl text-center shadow-sm">
                            <div className="text-3xl font-black text-green-700">{records.filter(r => r.status === "Resuelto").length}</div>
                            <div className="text-[10px] font-bold text-green-600 uppercase tracking-widest">Resuelto</div>
                        </div>
                    </div>

                    {/* Modal */}
                    {showForm && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl">
                                <h2 className="text-xl font-black mb-6 uppercase italic tracking-tighter text-slate-800">
                                    {editId ? "Editar Registro" : "Nuevo Registro"}
                                </h2>
                                <div className="space-y-4">
                                    <div><label className="text-[10px] font-bold text-slate-400 uppercase">Fecha</label><input type="date" className="w-full border rounded-xl p-3 font-bold" value={form.fecha} onChange={e => setForm({...form, fecha: e.target.value})} /></div>
                                    <input placeholder="EQUIPO" className="w-full border-2 p-3 rounded-xl font-bold uppercase" value={form.equipo} onChange={e => setForm({...form, equipo: e.target.value})} />
                                    <textarea placeholder="NOVEDAD" className="w-full border-2 p-3 rounded-xl h-20" value={form.novedad} onChange={e => setForm({...form, novedad: e.target.value})} />
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-[9px] font-bold text-slate-400">INICIO</label><input type="time" className="w-full border rounded-lg p-2" value={form.inicio} onChange={e => setForm({...form, inicio: e.target.value})} /></div>
                                        <div><label className="text-[9px] font-bold text-slate-400">FIN</label><input type="time" className="w-full border rounded-lg p-2" value={form.fin} onChange={e => setForm({...form, fin: e.target.value})} /></div>
                                    </div>
                                    <select className="w-full border-2 p-3 rounded-xl font-bold" value={form.status} onChange={e => setForm({...form, status: e.target.value})}>
                                        <option>Pendiente</option><option>En Proceso</option><option>Resuelto</option>
                                    </select>
                                    <button onClick={guardar} className="w-full bg-red-600 text-white py-4 rounded-2xl font-black uppercase italic tracking-widest shadow-xl hover:bg-red-700 transition">GUARDAR</button>
                                    <button onClick={cerrarForm} className="w-full text-slate-400 font-bold text-[10px] uppercase">Cancelar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
