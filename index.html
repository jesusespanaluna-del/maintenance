<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sika Maintenance - Registro Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#f3f4f6]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        function diffMinutes(t1, t2) {
            if (!t1 || !t2) return null;
            const [h1, m1] = t1.split(":").map(Number);
            const [h2, m2] = t2.split(":").map(Number);
            let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (diff < 0) diff += 1440;
            const h = Math.floor(diff / 60);
            const m = diff % 60;
            return h > 0 ? `${h}h ${m}m` : `${m}m`;
        }

        function App() {
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem("sika_data_vFinal_v2");
                return saved ? JSON.parse(saved) : [];
            });
            const [showForm, setShowForm] = useState(false);
            const [editId, setEditId] = useState(null);
            
            // Estados para el Buscador/Filtros
            const [filterTerm, setFilterTerm] = useState("");
            const [dateDesde, setDateDesde] = useState("");
            const [dateHasta, setDateHasta] = useState("");

            const [form, setForm] = useState({
                equipo: "", novedad: "", reporte: "", inicio: "", fin: "", 
                status: "Completado", fecha: new Date().toISOString().split('T')[0]
            });

            useEffect(() => {
                localStorage.setItem("sika_data_vFinal_v2", JSON.stringify(records));
            }, [records]);

            // Lógica de Filtrado (Buscador)
            const filteredRecords = useMemo(() => {
                return records.filter(r => {
                    const matchTerm = r.equipo.toLowerCase().includes(filterTerm.toLowerCase());
                    const matchDesde = dateDesde ? r.fecha >= dateDesde : true;
                    const matchHasta = dateHasta ? r.fecha <= dateHasta : true;
                    return matchTerm && matchDesde && matchHasta;
                });
            }, [records, filterTerm, dateDesde, dateHasta]);

            const guardar = () => {
                if(!form.equipo || !form.fecha) return alert("Falta equipo o fecha");
                if (editId) {
                    setRecords(records.map(r => r.id === editId ? form : r));
                } else {
                    setRecords([{ ...form, id: Date.now() }, ...records]);
                }
                cerrarForm();
            };

            const cerrarForm = () => {
                setShowForm(false);
                setEditId(null);
                setForm({ equipo: "", novedad: "", reporte: "", inicio: "", fin: "", status: "Completado", fecha: new Date().toISOString().split('T')[0] });
            };

            const exportarExcel = () => {
                if (filteredRecords.length === 0) return alert("No hay datos filtrados para exportar.");
                const header = "Fecha,Equipo,Novedad,Status,Hora Reporte,Hora Inicio,Hora Fin,Espera,Duracion\n";
                const csv = filteredRecords.map(r => `${r.fecha},"${r.equipo}","${r.novedad}",${r.status},${r.reporte},${r.inicio},${r.fin},${diffMinutes(r.reporte, r.inicio)},${diffMinutes(r.inicio, r.fin)}`).join("\n");
                const blob = new Blob(["\uFEFF" + header + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `Sika_Reporte_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();
            };

            return (
                <div className="min-h-screen p-4 max-w-6xl mx-auto">
                    {/* Header */}
                    <div className="flex justify-between items-end mb-6">
                        <div>
                            <h1 className="text-4xl font-black text-slate-900 italic">SIKA <span className="text-red-600 underline">MTTO</span></h1>
                            <p className="text-slate-500 font-bold text-xs uppercase tracking-widest">Gestión de Correctivos e Indicadores</p>
                        </div>
                        <button onClick={() => setShowForm(true)} className="bg-red-600 text-white px-6 py-3 rounded-xl font-black shadow-lg hover:bg-red-700 transition active:scale-95 uppercase italic">
                            + Registrar
                        </button>
                    </div>

                    {/* BUSCADOR Y FILTROS */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-end">
                        <div className="flex-1 min-w-[200px]">
                            <label className="block text-[10px] font-black text-slate-400 uppercase mb-1">Buscar por Equipo</label>
                            <input className="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm outline-none focus:border-red-500" 
                                placeholder="Ej: Turmix..." value={filterTerm} onChange={e => setFilterTerm(e.target.value)} />
                        </div>
                        <div>
                            <label className="block text-[10px] font-black text-slate-400 uppercase mb-1">Desde</label>
                            <input type="date" className="bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm outline-none" 
                                value={dateDesde} onChange={e => setDateDesde(e.target.value)} />
                        </div>
                        <div>
                            <label className="block text-[10px] font-black text-slate-400 uppercase mb-1">Hasta</label>
                            <input type="date" className="bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm outline-none" 
                                value={dateHasta} onChange={e => setDateHasta(e.target.value)} />
                        </div>
                        <button onClick={exportarExcel} className="bg-slate-800 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2 hover:bg-slate-900">
                            <span>📥</span> Excel
                        </button>
                    </div>

                    {/* TABLA */}
                    <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                        <table className="w-full text-left border-collapse text-sm">
                            <thead className="bg-slate-900 text-white font-bold uppercase text-[10px]">
                                <tr>
                                    <th className="px-6 py-4">Fecha / Equipo</th>
                                    <th className="px-6 py-4 text-center">T. Reporte</th>
                                    <th className="px-6 py-4 text-center bg-orange-600">Espera</th>
                                    <th className="px-6 py-4 text-center">T. Inicio</th>
                                    <th className="px-6 py-4 text-center bg-blue-600">Reparación</th>
                                    <th className="px-6 py-4 text-center">T. Fin</th>
                                    <th className="px-6 py-4"></th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {filteredRecords.map(r => (
                                    <tr key={r.id} className="hover:bg-slate-50 transition">
                                        <td className="px-6 py-4">
                                            <div className="text-[10px] font-black text-red-600">{r.fecha}</div>
                                            <div className="font-bold text-slate-800 uppercase">{r.equipo}</div>
                                            <div className="text-[11px] text-slate-400 truncate max-w-[200px]">{r.novedad}</div>
                                        </td>
                                        <td className="px-6 py-4 text-center font-mono font-bold text-slate-500">{r.reporte || "--:--"}</td>
                                        <td className="px-6 py-4 text-center bg-orange-50 font-black text-orange-700">{diffMinutes(r.reporte, r.inicio) || "0m"}</td>
                                        <td className="px-6 py-4 text-center font-mono font-bold text-slate-500">{r.inicio || "--:--"}</td>
                                        <td className="px-6 py-4 text-center bg-blue-50 font-black text-blue-700">{diffMinutes(r.inicio, r.fin) || "0m"}</td>
                                        <td className="px-6 py-4 text-center font-mono font-bold text-slate-500">{r.fin || "--:--"}</td>
                                        <td className="px-6 py-4 text-right">
                                            <button onClick={() => abrirEditor(r)} className="p-2 hover:bg-slate-200 rounded-lg">✏️</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {/* MODAL FORMULARIO */}
                    {showForm && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl">
                                <h2 className="text-2xl font-black mb-6 italic uppercase tracking-tighter text-slate-800">Detalle de Correctivo</h2>
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-400 uppercase mb-1">Fecha</label>
                                            <input type="date" className="w-full border border-slate-200 rounded-xl p-3 font-bold" value={form.fecha} onChange={e => setForm({...form, fecha: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-black text-slate-400 uppercase mb-1">Equipo</label>
                                            <input className="w-full border border-slate-200 rounded-xl p-3 font-bold uppercase" value={form.equipo} onChange={e => setForm({...form, equipo: e.target.value})} />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-black text-slate-400 uppercase mb-1">Falla / Novedad</label>
                                        <textarea className="w-full border border-slate-200 rounded-xl p-3 h-20" value={form.novedad} onChange={e => setForm({...form, novedad: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-3 gap-3">
                                        <div><label className="block text-[9px] font-black text-slate-400 uppercase">Reporte</label><input type="time" className="w-full border rounded-lg p-2" value={form.reporte} onChange={e => setForm({...form, reporte: e.target.value})} /></div>
                                        <div><label className="block text-[9px] font-black text-orange-500 uppercase">Inicio</label><input type="time" className="w-full border border-orange-200 rounded-lg p-2" value={form.inicio} onChange={e => setForm({...form, inicio: e.target.value})} /></div>
                                        <div><label className="block text-[9px] font-black text-blue-500 uppercase">Fin</label><input type="time" className="w-full border border-blue-200 rounded-lg p-2" value={form.fin} onChange={e => setForm({...form, fin: e.target.value})} /></div>
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <button onClick={cerrarForm} className="flex-1 py-3 font-bold text-slate-400 uppercase text-xs">Cancelar</button>
                                        <button onClick={guardar} className="flex-1 bg-red-600 text-white py-4 rounded-2xl font-black uppercase italic tracking-widest shadow-xl shadow-red-100 hover:bg-red-700">Guardar</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
