<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sika Maintenance - Registro de Correctivos</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f9fafb]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Función para cálculos de tiempo (Duración y Espera)
        function diffMinutes(t1, t2) {
            if (!t1 || !t2) return null;
            const [h1, m1] = t1.split(":").map(Number);
            const [h2, m2] = t2.split(":").map(Number);
            let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (diff < 0) diff += 1440; // Por si pasa de medianoche
            const h = Math.floor(diff / 60);
            const m = diff % 60;
            return h > 0 ? `${h}h ${m}m` : `${m}m`;
        }

        function App() {
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem("sika_data_v3");
                return saved ? JSON.parse(saved) : [];
            });
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState({
                equipo: "", novedad: "", reporte: "", inicio: "", fin: "", status: "Pendiente", fecha: new Date().toLocaleDateString()
            });

            useEffect(() => {
                localStorage.setItem("sika_data_v3", JSON.stringify(records));
            }, [records]);

            const guardar = () => {
                if(!form.equipo || !form.novedad) return alert("Por favor, ingresa el Equipo y la Novedad.");
                setRecords([{ ...form, id: Date.now() }, ...records]);
                setShowForm(false);
                setForm({ equipo: "", novedad: "", reporte: "", inicio: "", fin: "", status: "Pendiente", fecha: new Date().toLocaleDateString() });
            };

            // Función para Exportar a Excel (CSV)
            const exportarExcel = () => {
                if (records.length === 0) return alert("No hay datos para exportar.");
                const header = "Fecha,Equipo,Novedad,Status,Hora Reporte,Hora Inicio,Hora Fin,Tiempo de Espera,Duracion Reparacion\n";
                const csvContent = records.map(r => {
                    const espera = diffMinutes(r.reporte, r.inicio) || "0m";
                    const duracion = diffMinutes(r.inicio, r.fin) || "0m";
                    return `${r.fecha},"${r.equipo}","${r.novedad}",${r.status},${r.reporte},${r.inicio},${r.fin},${espera},${duracion}`;
                }).join("\n");
                
                const blob = new Blob([header + csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `Reporte_Sika_${new Date().toLocaleDateString()}.csv`);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        {/* Header estilo Claude/Moderno */}
                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                            <div>
                                <h1 className="text-3xl font-bold text-slate-900 tracking-tight">Mantenimiento Sika</h1>
                                <p className="text-slate-500">Gestión de correctivos e indicadores de tiempo.</p>
                            </div>
                            <div className="flex gap-3">
                                <button onClick={exportarExcel} className="flex items-center gap-2 bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-lg font-medium shadow-sm hover:bg-slate-50 transition">
                                    <span>📥</span> Exportar Excel
                                </button>
                                <button onClick={() => setShowForm(true)} className="bg-red-600 text-white px-5 py-2 rounded-lg font-semibold shadow-md hover:bg-red-700 transition">
                                    + Nuevo Registro
                                </button>
                            </div>
                        </div>

                        {/* Tabla Profesional */}
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <table className="w-full text-left border-collapse">
                                <thead className="bg-slate-50 border-b border-slate-200">
                                    <tr className="text-slate-600 text-xs uppercase font-bold tracking-wider">
                                        <th className="px-6 py-4">Equipo / Novedad</th>
                                        <th className="px-6 py-4 text-center">T. Reporte</th>
                                        <th className="px-6 py-4 text-center text-orange-600 italic">Espera</th>
                                        <th className="px-6 py-4 text-center">T. Inicio</th>
                                        <th className="px-6 py-4 text-center text-blue-600 italic">Reparación</th>
                                        <th className="px-6 py-4 text-center">T. Fin</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {records.length === 0 ? (
                                        <tr><td colSpan="6" className="py-12 text-center text-slate-400 italic">No hay registros hoy.</td></tr>
                                    ) : (
                                        records.map(r => (
                                            <tr key={r.id} className="hover:bg-slate-50/50 transition">
                                                <td className="px-6 py-4">
                                                    <div className="font-bold text-slate-800 uppercase">{r.equipo}</div>
                                                    <div className="text-sm text-slate-500">{r.novedad}</div>
                                                </td>
                                                <td className="px-6 py-4 text-center font-mono text-slate-600">{r.reporte || "--:--"}</td>
                                                <td className="px-6 py-4 text-center bg-orange-50/30">
                                                    <span className="font-bold text-orange-700">{diffMinutes(r.reporte, r.inicio) || "0m"}</span>
                                                </td>
                                                <td className="px-6 py-4 text-center font-mono text-slate-600">{r.inicio || "--:--"}</td>
                                                <td className="px-6 py-4 text-center bg-blue-50/30">
                                                    <span className="font-bold text-blue-700">{diffMinutes(r.inicio, r.fin) || "0m"}</span>
                                                </td>
                                                <td className="px-6 py-4 text-center font-mono text-slate-600">{r.fin || "--:--"}</td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Modal de Registro */}
                    {showForm && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-8 border border-slate-100">
                                <h2 className="text-xl font-bold text-slate-900 mb-6">Registrar Incidencia</h2>
                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">EQUIPO</label>
                                        <input className="w-full border border-slate-200 rounded-lg p-3 outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500 uppercase" 
                                            placeholder="Nombre de la línea o equipo" onChange={e => setForm({...form, equipo: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1">NOVEDAD</label>
                                        <textarea className="w-full border border-slate-200 rounded-lg p-3 outline-none focus:ring-2 focus:ring-red-500/20 focus:border-red-500" 
                                            placeholder="Describe la falla..." rows="2" onChange={e => setForm({...form, novedad: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-3 gap-4 text-center">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Hora Reporte</label>
                                            <input type="time" className="w-full border border-slate-200 rounded-lg p-2 text-sm" onChange={e => setForm({...form, reporte: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Hora Inicio</label>
                                            <input type="time" className="w-full border border-slate-200 rounded-lg p-2 text-sm" onChange={e => setForm({...form, inicio: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Hora Fin</label>
                                            <input type="time" className="w-full border border-slate-200 rounded-lg p-2 text-sm" onChange={e => setForm({...form, fin: e.target.value})} />
                                        </div>
                                    </div>
                                    <div className="flex gap-3 pt-4">
                                        <button onClick={() => setShowForm(false)} className="flex-1 px-4 py-3 border border-slate-200 rounded-xl font-semibold text-slate-600 hover:bg-slate-50 transition">Cancelar</button>
                                        <button onClick={guardar} className="flex-1 px-4 py-3 bg-red-600 text-white rounded-xl font-semibold hover:bg-red-700 shadow-lg shadow-red-200 transition">Guardar Registro</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
