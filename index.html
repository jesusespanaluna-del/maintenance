<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Correctivos Sika</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const STATUS_COLORS = {
            "Pendiente": "bg-yellow-100 text-yellow-800",
            "En Proceso": "bg-blue-100 text-blue-800",
            "Resuelto": "bg-green-100 text-green-800",
        };

        const emptyForm = {
            fecha: new Date().toISOString().split("T")[0],
            equipo: "",
            novedad: "",
            status: "Pendiente",
            tiempoInicio: "",
            tiempoFin: "",
        };

        function calcDuracion(inicio, fin) {
            if (!inicio || !fin) return "-";
            const [h1, m1] = inicio.split(":").map(Number);
            const [h2, m2] = fin.split(":").map(Number);
            let total = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (total < 0) total += 1440; // Manejo de cambio de día
            const h = Math.floor(total / 60);
            const m = total % 60;
            return h > 0 ? `${h}h ${m}m` : `${m}m`;
        }

        const STORAGE_KEY = "correctivos_data_sika";

        function App() {
            const [records, setRecords] = useState([]);
            const [form, setForm] = useState(emptyForm);
            const [editId, setEditId] = useState(null);
            const [showForm, setShowForm] = useState(false);
            const [filters, setFilters] = useState({ fecha: "", equipo: "", status: "" });

            // Cargar datos al iniciar
            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) setRecords(JSON.parse(saved));
            }, []);

            // Guardar datos automáticamente
            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            }, [records]);

            const handleSubmit = () => {
                if (!form.equipo || !form.novedad) return alert("Equipo y Novedad son obligatorios.");
                if (editId !== null) {
                    setRecords(r => r.map(rec => rec.id === editId ? { ...form, id: editId } : rec));
                    setEditId(null);
                } else {
                    setRecords(r => [...r, { ...form, id: Date.now() }]);
                }
                setForm(emptyForm);
                setShowForm(false);
            };

            const handleEdit = (rec) => {
                setForm({ ...rec });
                setEditId(rec.id);
                setShowForm(true);
            };

            const handleDelete = (id) => {
                if (confirm("¿Eliminar este registro?")) setRecords(r => r.filter(rec => rec.id !== id));
            };

            const filtered = records.filter(r => {
                return (
                    (!filters.fecha || r.fecha === filters.fecha) &&
                    (!filters.equipo || r.equipo.toLowerCase().includes(filters.equipo.toLowerCase())) &&
                    (!filters.status || r.status === filters.status)
                );
            });

            const exportCSV = () => {
                const header = "Fecha,Equipo,Novedad,Status,Tiempo Inicio,Tiempo Fin,Duracion\n";
                const rows = filtered.map(r => 
                    `${r.fecha},"${r.equipo}","${r.novedad}",${r.status},${r.tiempoInicio},${r.tiempoFin},${calcDuracion(r.tiempoInicio, r.tiempoFin)}`
                ).join("\n");
                const blob = new Blob([header + rows], { type: "text/csv;charset=utf-8;" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = "correctivos_mantenimiento.csv"; a.click();
            };

            return (
                <div className="min-h-screen bg-gray-50 p-4">
                    {/* Header Principal Azul */}
                    <div className="bg-blue-700 text-white rounded-xl p-6 mb-6 flex items-center justify-between shadow-lg">
                        <div>
                            <h1 className="text-2xl font-bold flex items-center gap-2">🛠️ Correctivos del Día</h1>
                            <p className="text-blue-100 text-sm opacity-90">Registro histórico de incidencias de mantenimiento</p>
                        </div>
                        <span className="bg-blue-900/50 px-4 py-2 rounded-full text-sm font-medium border border-blue-400">
                            {records.length} registros totales
                        </span>
                    </div>

                    {/* Barra de Filtros */}
                    <div className="bg-white rounded-xl shadow-sm p-4 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4 border border-gray-100">
                        <input type="date" className="border border-gray-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" 
                            value={filters.fecha} onChange={e => setFilters({...filters, fecha: e.target.value})} />
                        
                        <div className="relative">
                            <span className="absolute left-3 top-2.5 text-gray-400">🔍</span>
                            <input type="text" className="w-full border border-gray-200 rounded-lg pl-9 pr-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" 
                                placeholder="Buscar Equipo..." value={filters.equipo} onChange={e => setFilters({...filters, equipo: e.target.value})} />
                        </div>

                        <select className="border border-gray-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                            value={filters.status} onChange={e => setFilters({...filters, status: e.target.value})}>
                            <option value="">Todos los status</option>
                            <option>Pendiente</option>
                            <option>En Proceso</option>
                            <option>Resuelto</option>
                        </select>
                    </div>

                    {/* Botones de Acción */}
                    <div className="flex gap-3 mb-6">
                        <button onClick={() => { setForm(emptyForm); setEditId(null); setShowForm(true); }}
                            className="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-md hover:bg-blue-700 transition-all flex items-center gap-2">
                            + Nuevo Correctivo
                        </button>
                        <button onClick={exportCSV}
                            className="bg-green-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-md hover:bg-green-700 transition-all flex items-center gap-2">
                            ⬇️ Exportar CSV
                        </button>
                        {(filters.fecha || filters.equipo || filters.status) && (
                            <button onClick={() => setFilters({ fecha: "", equipo: "", status: "" })}
                                className="bg-gray-200 text-gray-700 px-6 py-2.5 rounded-xl font-bold hover:bg-gray-300 transition-all">
                                ✕ Limpiar filtros
                            </button>
                        )}
                    </div>

                    {/* Formulario Modal */}
                    {showForm && (
                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 border border-gray-100">
                                <h2 className="text-xl font-bold text-blue-800 mb-6 flex items-center gap-2">
                                    {editId ? "✏️ Editar Registro" : "➕ Nuevo Registro"}
                                </h2>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 uppercase tracking-wider">Equipo *</label>
                                        <input type="text" className="w-full border-2 border-gray-100 rounded-xl px-4 py-3 mt-1 focus:border-blue-500 outline-none transition-all uppercase font-bold" 
                                            value={form.equipo} onChange={e => setForm({...form, equipo: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 uppercase tracking-wider">Novedad *</label>
                                        <textarea className="w-full border-2 border-gray-100 rounded-xl px-4 py-3 mt-1 focus:border-blue-500 outline-none transition-all" rows={2}
                                            value={form.novedad} onChange={e => setForm({...form, novedad: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 uppercase tracking-wider">Inicio Trabajo</label>
                                            <input type="time" className="w-full border-2 border-gray-100 rounded-xl px-4 py-3 mt-1 focus:border-blue-500 outline-none"
                                                value={form.tiempoInicio} onChange={e => setForm({...form, tiempoInicio: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-500 uppercase tracking-wider">Fin Trabajo</label>
                                            <input type="time" className="w-full border-2 border-gray-100 rounded-xl px-4 py-3 mt-1 focus:border-blue-500 outline-none"
                                                value={form.tiempoFin} onChange={e => setForm({...form, tiempoFin: e.target.value})} />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-gray-500 uppercase tracking-wider">Estado</label>
                                        <select className="w-full border-2 border-gray-100 rounded-xl px-4 py-3 mt-1 focus:border-blue-500 outline-none"
                                            value={form.status} onChange={e => setForm({...form, status: e.target.value})}>
                                            <option>Pendiente</option>
                                            <option>En Proceso</option>
                                            <option>Resuelto</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-8">
                                    <button onClick={handleSubmit} className="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg hover:bg-blue-700 active:scale-95 transition-all">
                                        {editId ? "Guardar Cambios" : "Guardar Registro"}
                                    </button>
                                    <button onClick={() => setShowForm(false)} className="px-6 py-3 bg-gray-100 text-gray-500 rounded-xl font-bold hover:bg-gray-200 transition-all">
                                        Cancelar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Tabla de Registros */}
                    <div className="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden mb-6">
                        <table className="w-full text-sm">
                            <thead className="bg-blue-700 text-white uppercase text-xs">
                                <tr>
                                    <th className="px-4 py-4 text-left">Fecha</th>
                                    <th className="px-4 py-4 text-left">Equipo</th>
                                    <th className="px-4 py-4 text-left">Novedad</th>
                                    <th className="px-4 py-4 text-center">Status</th>
                                    <th className="px-4 py-4 text-center">T. Inicio</th>
                                    <th className="px-4 py-4 text-center">T. Fin</th>
                                    <th className="px-4 py-4 text-center">Duración</th>
                                    <th className="px-4 py-4 text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {filtered.length === 0 ? (
                                    <tr><td colSpan="8" className="py-10 text-center text-gray-400 italic font-medium">No hay registros coincidentes.</td></tr>
                                ) : (
                                    filtered.map((r) => (
                                        <tr key={r.id} className="hover:bg-blue-50/50 transition-colors">
                                            <td className="px-4 py-4 text-gray-500">{r.fecha}</td>
                                            <td className="px-4 py-4 font-bold text-gray-800 uppercase">{r.equipo}</td>
                                            <td className="px-4 py-4 text-gray-600 max-w-xs truncate" title={r.novedad}>{r.novedad}</td>
                                            <td className="px-4 py-4 text-center">
                                                <span className={`px-3 py-1 rounded-full text-[10px] font-black uppercase ${STATUS_COLORS[r.status]}`}>
                                                    {r.status}
                                                </span>
                                            </td>
                                            <td className="px-4 py-4 text-center font-mono text-gray-500">{r.tiempoInicio || "-"}</td>
                                            <td className="px-4 py-4 text-center font-mono text-gray-500">{r.tiempoFin || "-"}</td>
                                            <td className="px-4 py-4 text-center font-bold text-blue-600">
                                                {calcDuracion(r.tiempoInicio, r.tiempoFin)}
                                            </td>
                                            <td className="px-4 py-4 text-center">
                                                <div className="flex justify-center gap-2">
                                                    <button onClick={() => handleEdit(r)} className="bg-yellow-400 p-1.5 rounded-lg text-white hover:bg-yellow-500 transition-colors shadow-sm" title="Editar">✏️</button>
                                                    <button onClick={() => handleDelete(r.id)} className="bg-red-500 p-1.5 rounded-lg text-white hover:bg-red-600 transition-colors shadow-sm" title="Eliminar">🗑️</button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>

                    {/* Cuadros de Resumen Inferiores */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-yellow-100 border-2 border-yellow-200 rounded-2xl p-6 text-center shadow-sm">
                            <div className="text-3xl font-black text-yellow-700">{records.filter(r => r.status === "Pendiente").length}</div>
                            <div className="text-xs font-bold text-yellow-600 uppercase tracking-widest mt-1">Pendiente</div>
                        </div>
                        <div className="bg-blue-100 border-2 border-blue-200 rounded-2xl p-6 text-center shadow-sm">
                            <div className="text-3xl font-black text-blue-700">{records.filter(r => r.status === "En Proceso").length}</div>
                            <div className="text-xs font-bold text-blue-600 uppercase tracking-widest mt-1">En Proceso</div>
                        </div>
                        <div className="bg-green-100 border-2 border-green-200 rounded-2xl p-6 text-center shadow-sm">
                            <div className="text-3xl font-black text-green-700">{records.filter(r => r.status === "Resuelto").length}</div>
                            <div className="text-xs font-bold text-green-600 uppercase tracking-widest mt-1">Resuelto</div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
