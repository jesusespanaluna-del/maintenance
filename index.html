<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛠️ Registro de Correctivos Sika</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const STATUS_COLORS = {
            "Pendiente": "bg-yellow-100 text-yellow-800",
            "En Proceso": "bg-blue-100 text-blue-800",
            "Resuelto": "bg-green-100 text-green-800",
        };

        // Función corregida para calcular Duración (Inicio a Fin)
        function calcDuracion(inicio, fin) {
            if (!inicio || !fin) return "-";
            const [h1, m1] = inicio.split(":").map(Number);
            const [h2, m2] = fin.split(":").map(Number);
            let total = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (total < 0) total += 1440; // Manejo de cambio de día
            const h = Math.floor(total / 60);
            const m = total % 60;
            return h > 0 ? h + "h " + m + "m" : m + "m";
        }

        // Función corregida para calcular Espera (Reportado a Inicio)
        function calcEspera(reportado, inicio) {
            if (!reportado || !inicio) return null;
            const [h1, m1] = reportado.split(":").map(Number);
            const [h2, m2] = inicio.split(":").map(Number);
            let total = (h2 * 60 + m2) - (h1 * 60 + m1);
            if (total < 0) total += 1440;
            const h = Math.floor(total / 60);
            const m = total % 60;
            return h > 0 ? h + "h " + m + "m" : m + "m";
        }

        const STORAGE_KEY = "correctivos_sika_v1";

        function App() {
            const [records, setRecords] = useState([]);
            const [showForm, setShowForm] = useState(false);
            const [form, setForm] = useState({
                fecha: new Date().toISOString().split("T")[0],
                equipo: "",
                novedad: "",
                status: "Pendiente",
                tiempoReportado: "",
                tiempoInicio: "",
                tiempoFin: ""
            });

            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) setRecords(JSON.parse(saved));
            }, []);

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            }, [records]);

            const handleSubmit = () => {
                if (!form.equipo || !form.novedad) return alert("Equipo y Novedad son obligatorios");
                setRecords([...records, { ...form, id: Date.now() }]);
                setForm({ ...form, equipo: "", novedad: "", tiempoReportado: "", tiempoInicio: "", tiempoFin: "" });
                setShowForm(false);
            };

            return (
                <div className="min-h-screen bg-slate-50 p-4 font-sans">
                    {/* Header Estilo Industrial */}
                    <div className="bg-red-600 text-white rounded-t-lg p-5 shadow-lg border-b-4 border-red-800">
                        <h1 className="text-2xl font-black italic">SIKA MAINTENANCE</h1>
                        <p className="text-sm opacity-90">Registro de Mantenimiento Correctivo</p>
                    </div>

                    <div className="bg-white p-4 shadow-md mb-6 flex justify-between items-center rounded-b-lg">
                        <button onClick={() => setShowForm(true)} className="bg-red-600 text-white px-6 py-2 rounded font-bold uppercase text-sm hover:bg-red-700 transition">
                            + Registrar Novedad
                        </button>
                        <div className="text-right">
                            <span className="text-xs text-gray-500 block">Total Registros</span>
                            <span className="text-xl font-bold text-slate-700">{records.length}</span>
                        </div>
                    </div>

                    {/* Tabla de Datos Principal */}
                    <div className="bg-white rounded-lg shadow-xl overflow-hidden border border-gray-200">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-800 text-white text-xs uppercase">
                                    <th className="p-3 border-r border-slate-700">Equipo / Novedad</th>
                                    <th className="p-3 border-r border-slate-700 text-center">Status</th>
                                    <th className="p-3 border-r border-slate-700 text-center">T. Reporte</th>
                                    <th className="p-3 border-r border-slate-700 text-center">T. Inicio</th>
                                    <th className="p-3 border-r border-slate-700 text-center">T. Fin</th>
                                    <th className="p-3 bg-orange-600 text-center font-black italic">Espera</th>
                                    <th className="p-3 bg-blue-600 text-center font-black italic">Reparación</th>
                                </tr>
                            </thead>
                            <tbody className="text-sm">
                                {records.length === 0 ? (
                                    <tr><td colSpan="7" className="p-10 text-center text-gray-400 italic">No hay datos registrados hoy.</td></tr>
                                ) : (
                                    records.map((r) => (
                                        <tr key={r.id} className="border-b hover:bg-slate-50 transition">
                                            <td className="p-3 border-r">
                                                <div className="font-bold text-slate-800 uppercase">{r.equipo}</div>
                                                <div className="text-xs text-gray-500">{r.novedad}</div>
                                            </td>
                                            <td className="p-3 border-r text-center">
                                                <span className={`px-2 py-1 rounded-full text-[10px] font-bold uppercase ${STATUS_COLORS[r.status]}`}>{r.status}</span>
                                            </td>
                                            <td className="p-3 border-r text-center font-mono">{r.tiempoReportado || "--:--"}</td>
                                            <td className="p-3 border-r text-center font-mono">{r.tiempoInicio || "--:--"}</td>
                                            <td className="p-3 border-r text-center font-mono">{r.tiempoFin || "--:--"}</td>
                                            <td className="p-3 border-r text-center font-bold text-orange-600 bg-orange-50">
                                                {calcEspera(r.tiempoReportado, r.tiempoInicio) || "0m"}
                                            </td>
                                            <td className="p-3 text-center font-bold text-blue-700 bg-blue-50">
                                                {calcDuracion(r.tiempoInicio, r.tiempoFin)}
                                            </td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>

                    {/* Modal del Formulario */}
                    {showForm && (
                        <div className="fixed inset-0 bg-slate-900/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-lg shadow-2xl w-full max-w-md overflow-hidden">
                                <div className="bg-slate-800 p-4 text-white font-bold flex justify-between">
                                    <span>NUEVO REPORTE</span>
                                    <button onClick={() => setShowForm(false)}>✕</button>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 block mb-1">EQUIPO</label>
                                        <input type="text" className="w-full border-2 border-slate-200 rounded p-2 focus:border-red-500 outline-none uppercase"
                                            value={form.equipo} onChange={e => setForm({...form, equipo: e.target.value})} placeholder="Ej: Linea Turmix" />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-500 block mb-1">NOVEDAD / FALLA</label>
                                        <textarea className="w-full border-2 border-slate-200 rounded p-2 focus:border-red-500 outline-none"
                                            value={form.novedad} onChange={e => setForm({...form, novedad: e.target.value})} placeholder="Describa el problema..." />
                                    </div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500 block mb-1 italic">REPORTADO</label>
                                            <input type="time" className="w-full border-2 border-slate-200 rounded p-1 text-sm"
                                                value={form.tiempoReportado} onChange={e => setForm({...form, tiempoReportado: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500 block mb-1 italic">INICIO TRABAJO</label>
                                            <input type="time" className="w-full border-2 border-slate-200 rounded p-1 text-sm"
                                                value={form.tiempoInicio} onChange={e => setForm({...form, tiempoInicio: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500 block mb-1 italic">FIN TRABAJO</label>
                                            <input type="time" className="w-full border-2 border-slate-200 rounded p-1 text-sm"
                                                value={form.tiempoFin} onChange={e => setForm({...form, tiempoFin: e.target.value})} />
                                        </div>
                                    </div>
                                    <button onClick={handleSubmit} className="w-full bg-red-600 text-white py-3 rounded font-black hover:bg-red-700 shadow-lg">
                                        GUARDAR REGISTRO
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
